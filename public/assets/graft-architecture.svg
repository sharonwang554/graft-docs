<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" style="background-color: transparent; font-family: sans-serif; font-size: 14px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <!-- Edges -->
  <path d="M 140 120 C 180 120, 180 60, 227 60" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 140 120 C 180 120, 170 180, 207 180" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 410 60 L 507 60" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 430 180 L 507 180" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 730 180 L 777 180" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Nodes -->
  <g>
    <!-- Source files -->
    <rect x="20" y="95" width="120" height="50" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="80" y="125" fill="#333333" text-anchor="middle">Source files</text>
  </g>

  <g>
    <!-- Tier 1 -->
    <rect x="230" y="30" width="180" height="60" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="320" y="53" fill="#333333" text-anchor="middle">Tier 1 — tree-sitter</text>
    <text x="320" y="73" fill="#333333" text-anchor="middle">(no model, no key)</text>
  </g>

  <g>
    <!-- wiring.json -->
    <rect x="510" y="30" width="220" height="60" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="620" y="53" fill="#333333" text-anchor="middle">graft/.graph/wiring.json</text>
    <text x="620" y="73" fill="#333333" text-anchor="middle">(per-symbol code graph)</text>
  </g>

  <g>
    <!-- Pass 1 -->
    <rect x="210" y="150" width="220" height="60" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="320" y="173" fill="#333333" text-anchor="middle">Pass 1 — LLM summarizes</text>
    <text x="320" y="193" fill="#333333" text-anchor="middle">each file (--deep)</text>
  </g>

  <g>
    <!-- Pass 2 -->
    <rect x="510" y="150" width="220" height="60" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="620" y="173" fill="#333333" text-anchor="middle">Pass 2 — group into nodes</text>
    <text x="620" y="193" fill="#333333" text-anchor="middle">+ typed links</text>
  </g>

  <g>
    <!-- graft/*.md -->
    <rect x="780" y="150" width="200" height="60" rx="5" fill="#ECECFF" stroke="#9370DB" stroke-width="2" />
    <text x="880" y="173" fill="#333333" text-anchor="middle">graft/*.md</text>
    <text x="880" y="193" fill="#333333" text-anchor="middle">(markdown node graph)</text>
  </g>
</svg>